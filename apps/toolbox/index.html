<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/mona-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CraftChest 合成箱：数据不出浏览器的中文文本工具与前端交互工具箱。A private, all-in-browser toolbox with no backend."
    />
    <meta name="theme-color" content="#f7f2e9" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('craftchest.theme')
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>CraftChest · 合成箱</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
