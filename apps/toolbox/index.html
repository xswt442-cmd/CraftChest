<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/mona-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CraftChest：Craft 将材料制成可直接使用的成果，Chest 收纳可独立使用和复用的工具。所有处理均在浏览器本地完成。Craft turns inputs into ready-to-use outputs; Chest holds reusable tools. All processing stays in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CraftChest · 合成箱" />
    <meta property="og:title" content="CraftChest · 合成箱" />
    <meta
      property="og:description"
      content="Craft 将材料制成可直接使用的成果，Chest 收纳可独立使用和复用的工具。数据不出浏览器。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta name="theme-color" content="#f4f6f8" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('craftchest.theme')
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>CraftChest · 合成箱</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
